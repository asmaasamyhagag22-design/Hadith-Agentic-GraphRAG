name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run test suite
        run: uv run pytest -m "not requires_data and not requires_model and not requires_api"

      - name: Check documentation consistency
        run: uv run python -m src.check_docs
