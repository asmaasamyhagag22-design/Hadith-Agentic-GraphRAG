[project]
name = "sanad"
version = "0.1.0"
description = "Grounded RAG over Sahih Muslim, with isnad tracing planned on top"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    # retrieval
    "sentence-transformers",  # e5 embeddings + cross-encoder reranking
    "faiss-cpu",              # the vector index actually used at query time
    "rank-bm25",
    "numpy",
    # linkage/data audits read the downloaded MIS workbooks
    "openpyxl",
    # generation
    "google-genai",           # Gemini via Vertex AI
    "python-dotenv",
    # only used by src/chroma_ingest.py, an alternative store that the
    # query path does not go through — see README
    "chromadb",
    "streamlit>=1.42.0",
    "boto3>=1.44.3",
]

[dependency-groups]
cloud = [
    "numpy>=2.0.0",
    "google-genai>=1.0.0",
    "python-dotenv>=1.0.0",
    "streamlit>=1.42.0",
    "boto3>=1.44.3",
]
dev = [
    "aws-cdk-lib>=2.277.0",
    "constructs>=10.8.1",
    "moto[dynamodb]>=5.2.5",
    "playwright>=1.65.2",
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
markers = [
    "requires_data: test requires git-ignored artifacts in data/processed or data/raw/external",
    "requires_model: test requires downloading or loading embedding or reranker models",
    "requires_api: test requires Vertex AI / Gemini API credentials",
]
